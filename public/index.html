<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo Thumbnail Generator</title>
</head>
<body>
  <!-- A bare page for trying the API until the real page replaces it. -->
  <h1>Repo Thumbnail Generator</h1>
  <form action="/api/thumbnail" method="get">
    <label for="repo">GitHub repo link</label>
    <input id="repo" name="repo" placeholder="github.com/owner/repo" required>
    <button type="submit">Generate Thumbnail</button>
  </form>
</body>
</html>
